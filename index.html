<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Is it a good time to call?</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet">
  </head>

  <body>
    <main role="main" class="container-fluid px-0 overflow-hidden">

      <!-- Introductory Text -->
      <header id="introduction-header" class="text-center pt-4 pb-1">
        <h1>Is it a good time to call?</h1>
        <p>Visualizing the time of your loved ones</p>
      </header>

      <!-- Close Curtain Button -->
      <section id="ui-controls-section" class="text-center py-1">
        <button id="draw-curtains-button" class="btn btn-success my-2 my-sm-0" type="button">Draw My Curtains</button>
      </section>

      <!-- Place p5 canvas in here -->
      <section id="wall-of-windows-section" class="p-0 m-0"></section>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.js"></script>

    <!-- Custom JS -->
    <script src="script.js"></script>
  </body>
</html>
